name: Firmenprofil uebernehmen

# Wandelt einen ausgefuellten Firmen-Steckbrief in config/profiles/aktiv.yaml um
# und stellt das Ergebnis als Pull Request zur Freigabe.
#
# Bewusst kein direkter Push auf den Default-Branch: Das Profil steuert, welche
# Agenten aktiv sind. Diese Aenderung soll sichtbar und pruefbar sein.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  profil:
    # Nur ausgefuellte Steckbriefe, und nur von Personen mit Repo-Bezug.
    # Ein beliebiges Issue von aussen darf keinen PR ausloesen.
    if: >-
      contains(github.event.issue.labels.*.name, 'firmenprofil') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Steckbrief auswerten
        id: parse
        env:
          # Ueber die Umgebung, nicht per Template-Interpolation: der Issue-Text
          # ist Fremdtext und darf nicht in ein Shell-Kommando eingesetzt werden.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > /tmp/issue-body.md
          python3 scripts/parse_profile_issue.py \
            --body-file /tmp/issue-body.md \
            --output config/profiles/aktiv.yaml | tee /tmp/parse-output.txt

      - name: Auswahl berechnen
        run: |
          set -euo pipefail
          python3 scripts/select_agents.py \
            --profile config/profiles/aktiv.yaml \
            --output /tmp/agent-activation.json | tee -a /tmp/parse-output.txt

      - name: Paket weiterhin gueltig
        run: python3 scripts/validate_package.py --mode release

      - name: Pull Request stellen
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if git diff --quiet -- config/profiles/aktiv.yaml; then
            echo "unveraendert=true" >> "$GITHUB_OUTPUT"
            echo "Profil unveraendert, kein Pull Request noetig."
            exit 0
          fi

          BRANCH="onboarding/firmenprofil-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add config/profiles/aktiv.yaml
          git commit -m "chore(onboarding): Firmenprofil aus Steckbrief #${ISSUE_NUMBER} uebernehmen"
          git push --force-with-lease -u origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "Firmenprofil aus Steckbrief #${ISSUE_NUMBER}" \
              --body "$(printf 'Automatisch erzeugt aus dem Firmen-Steckbrief in #%s.\n\n```\n%s\n```\n\nDie Installation der Agenten ist davon unabhaengig und bereits erfolgt. Dieses Profil legt nur fest, welche Agenten als aktives Kernteam gelten.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$ISSUE_NUMBER" "$(cat /tmp/parse-output.txt)")"
          fi
          echo "unveraendert=false" >> "$GITHUB_OUTPUT"

      - name: Rueckmeldung am Steckbrief
        if: steps.pr.outputs.unveraendert == 'false'
        # v8 und bewusst nicht v9: v9 ist ESM-only und nimmt dem Skript
        # require() -- die naechste Zeile im script-Block braucht require('fs').
        # Dieser Workflow haengt an einem Issue-Ereignis, kein Pull Request
        # loest ihn aus; ein Bruch hier faellt der CI nicht auf, sondern erst
        # dem Kunden beim Steckbrief.
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const ergebnis = fs.readFileSync('/tmp/parse-output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                'Danke, der Steckbrief ist ausgewertet.',
                '',
                '```',
                ergebnis.trim(),
                '```',
                '',
                'Das Profil liegt als Pull Request zur Freigabe bereit. Es aendert',
                'nur die Priorisierung -- alle Agentendefinitionen sind bereits',
                'installiert und die uebrigen bleiben ohne Neuinstallation abrufbar.',
                '',
                'Nicht erkannte Auswahlwerte wurden bewusst verworfen und oben als',
                'Hinweis aufgefuehrt.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });

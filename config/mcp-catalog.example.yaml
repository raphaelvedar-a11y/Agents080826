# Katalog, keine aktive MCP-Konfiguration.
# Der Kunde installiert nur benoetigte Server und nutzt eigene Konten.
mcp_policy:
  default_enabled: false
  credentials_location: "outside_repository"
  customer_owned_accounts_only: true
  start_read_only: true
  write_tools_require_approval: true

categories:
  - id: memory
    purpose: "Kundeneigenes Wissens- und Zustandsmanagement"
    enabled: false
  - id: email
    purpose: "E-Mail lesen und Entwuerfe erstellen"
    enabled: false
  - id: calendar
    purpose: "Kalender lesen und freigabepflichtige Terminentwuerfe"
    enabled: false
  - id: cloud_storage
    purpose: "Dokumente in kundeneigenen Speichern"
    enabled: false
  - id: crm
    purpose: "Kundeneigenes CRM"
    enabled: false
  - id: accounting
    purpose: "Kundeneigene Buchhaltung, zu Beginn nur lesend"
    enabled: false
  - id: legal_research
    purpose: "Rechtsquellen und Recherche"
    enabled: false
  - id: source_control
    purpose: "Kundeneigene Code-Repositories"
    enabled: false
  - id: database
    purpose: "Kundeneigene Datenbank, zu Beginn nur lesend"
    enabled: false
  - id: social_media
    purpose: "Entwuerfe; Publikation nur mit Einzel-Freigabe"
    enabled: false
  - id: deployment
    purpose: "Preview und Deployment, Produktion nur mit Einzel-Freigabe"
    enabled: false

# Erwartete Integrationsfamilien aus den Agentendefinitionen. Dies sind weder
# Installationsbefehle noch aktive Server. Quelle, Version und Berechtigungen
# muessen vor der kundenseitigen Installation separat geprueft werden.
